/* Layout: a camp ledger. Character tabs across the top, one sheet per character: summary, then what needs doing, then the gear by slot. */
:root {
  --ink: #13151d;
  --panel: #1b1e29;
  --panel-2: #222636;
  --line: #303548;
  --fg: #ebe4d3;
  --muted: #a39b8a;
  --gold: #c9a45c;
  --gold-soft: rgba(201,164,92,.14);
  --r-common: #c9c4b9;
  --r-uncommon: #63c270;
  --r-rare: #55a8e6;
  --r-veryrare: #b583e6;
  --r-story: #e39a4a;
  --crit: #e5705f;
  --warn: #dbb54c;
  --ok: #63c270;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(30px, 6vw, 44px); letter-spacing: .01em; }
h2 { font-size: 26px; }
h3 { font-size: 20px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

header.top { display: grid; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
.savebar { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; }
.savebar b { color: var(--fg); font-weight: 500; }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--ink);
  display: flex; gap: 8px; overflow-x: auto; padding-block: 8px;
  scrollbar-width: thin;
}
.tab {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer;
  font: 500 15px var(--body); text-decoration: none;
}
.tab:hover { border-color: var(--gold); }
.tab:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.tab[aria-current="page"] { background: var(--gold-soft); border-color: var(--gold); }
.tab.party { padding-left: 14px; }
.mono {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font: 700 14px var(--display); color: var(--ink); background: var(--c, var(--gold));
}
.tab .flag { font-size: 12px; font-weight: 700; color: var(--ink); background: var(--warn); border-radius: 999px; padding: 0 7px; }
.tab .flag.crit { background: var(--crit); }

section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }

/* Character header */
.charhead { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.charhead .mono { width: 58px; height: 58px; font-size: 28px; }
.charhead .sub { color: var(--muted); }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.stat .k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 600 22px var(--display); }
.abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.abil div { background: var(--panel-2); border-radius: 8px; text-align: center; padding: 6px 0; }
.abil .k { font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.abil .v { font: 600 20px var(--display); }
.abil .hi { color: var(--gold); }

.approval { display: grid; gap: 4px; }
.meter { height: 8px; background: var(--panel-2); border-radius: 999px; position: relative; overflow: hidden; }
.meter i { position: absolute; top: 0; bottom: 0; left: 50%; background: var(--gold); border-radius: 999px; }
.meter::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .6; }

/* Needs list */
ul.needs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.needs li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 4px; padding: 2px 7px; color: var(--ink); white-space: nowrap; margin-top: 2px; }
.pill.crit { background: var(--crit); }
.pill.warn { background: var(--warn); }
.pill.tip { background: var(--r-rare); }
.pill.ok { background: var(--ok); }
.pill.best { background: var(--ok); }
.pill.alt { background: var(--r-rare); }
.pill.plan { background: var(--gold); }
.pill.no { background: var(--muted); }
ul.needs .who { color: var(--gold); font-weight: 700; }

/* Gear */
.gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.slot { border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--line)); border-radius: 8px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; background: var(--panel-2); }
.slot .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.slot .name { font-weight: 700; color: var(--rc, var(--fg)); }
.slot .note { font-size: 14px; color: var(--muted); }
.slot.empty { border-style: dashed; border-left-style: dashed; background: transparent; }
.slot.empty .name { color: var(--muted); font-weight: 500; font-style: italic; }
.slot .tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 1px 6px; border-radius: 3px; color: var(--ink); }
.slot .tag.dud { background: var(--warn); }
.slot .tag.empty { background: var(--muted); }
.slot .tag.crit { background: var(--crit); }
.r-common { --rc: var(--r-common); }
.r-uncommon { --rc: var(--r-uncommon); }
.r-rare { --rc: var(--r-rare); }
.r-veryrare { --rc: var(--r-veryrare); }
.r-story { --rc: var(--r-story); }
.opts { display: grid; gap: 8px; }
.opt { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; border: 1px solid var(--line); }
.opt.best { border-color: var(--ok); }
.opt .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 700; }
.opt p { margin: 0; color: var(--muted); font-size: 15px; }
ul.feat { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
ul.feat li::marker { color: var(--muted); }
dl.gloss { margin: 0; display: grid; gap: 8px; }
dl.gloss div { display: grid; gap: 2px; }
dl.gloss dt { font-weight: 700; }
dl.gloss dd { margin: 0; color: var(--muted); font-size: 15px; }
.plan { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--rc); margin-right: 6px; vertical-align: -1px; }

ul.ideas { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
ul.ideas li::marker { color: var(--gold); }
.camp { font-size: 14px; color: var(--muted); }

/* Party overview */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.mini { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; cursor: pointer; text-align: left; color: var(--fg); font: inherit; }
.mini:hover { border-color: var(--gold); }
.mini .row { display: flex; align-items: center; gap: 10px; }
.mini .meta { font-size: 13px; color: var(--muted); }
.mini .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.where { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.where.party { color: var(--gold); border-color: var(--gold); }

footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 480px) {
  .abil { grid-template-columns: repeat(3, 1fr); }
  .charhead .mono { width: 46px; height: 46px; font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .18s ease-out; }
  @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

  var raw = document.getElementById('party-data').textContent;

  var ABIL = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
  var SEV = { crit: 0, warn: 1, tip: 2 };

  var RLABEL = { common: 'Common', uncommon: 'Uncommon', rare: 'Rare', veryrare: 'Very rare', story: 'Story' };
  var VLABEL = { best: 'Best now', alt: 'Option', plan: 'Plan', no: 'Skip' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); }
  function mono(c) { return '<span class="mono" style="--c:' + esc(c.color) + '">' + esc(c.name.charAt(0)) + '</span>'; }
  function critCount(c) { return c.needs.filter(function (n) { return n.s === 'crit'; }).length; }
  function warnCount(c) { return c.needs.filter(function (n) { return n.s !== 'tip'; }).length; }
  function approvalWord(a) { if (a == null) return ''; if (a >= 60) return 'Very High'; if (a >= 40) return 'High'; if (a >= 20) return 'Medium'; if (a > -20) return 'Neutral'; return 'Low'; }

  var s = data.save;
  document.getElementById('savebar').innerHTML =
    '<span><b>' + esc(s.act) + '</b></span>' +
    '<span>' + esc(s.where) + '</span>' +
    '<span>Last save <b>' + esc(s.lastSave) + '</b> · ' + esc(s.playtime) + '</span>' +

    '<span>Gold <b class="num">' + Number(s.gold).toLocaleString('en-GB') + '</b></span>';
  document.getElementById('foot').innerHTML = 'Updated ' + esc(data.updated) + ' from your photos. Tell Claude when gear or levels change and this page gets updated. <span class="muted">(?) = text I couldn\'t read clearly.</span>';

  function renderTabs(active) {
    var html = '<a class="tab party" href="#party"' + (active === 'party' ? ' aria-current="page"' : '') + '>Party</a>';

      var n = warnCount(c), cr = critCount(c);
      html += '<a class="tab" href="#' + c.id + '"' + (active === c.id ? ' aria-current="page"' : '') + '>' + mono(c) + esc(c.name) +
        (n ? ' <span class="flag' + (cr ? ' crit' : '') + '" title="' + n + ' to fix">' + n + '</span>' : '') + '</a>';
    });
    document.getElementById('tabs').innerHTML = html;
  }

  function approvalBlock(a) {
    if (a == null) return '';
    var pct = Math.min(100, Math.abs(a)) / 2;
    var style = a >= 0 ? 'left:50%;width:' + pct + '%' : 'right:50%;left:auto;width:' + pct + '%';
    return '<div class="stat approval"><span class="k">Approval</span><span class="v num">' + a + ' <span class="muted" style="font-size:15px">' + approvalWord(a) + '</span></span><div class="meter" aria-hidden="true"><i style="' + style + '"></i></div></div>';
  }

  function needsList(items, withWho) {
    if (!items.length) return '<p class="muted">Nothing urgent.</p>';
    return '<ul class="needs">' + items.map(function (n) {
      return '<li><span class="pill ' + n.s + '">' + SEVLABEL[n.s] + '</span><span>' + (withWho ? '<span class="who">' + esc(n.who) + ':</span> ' : '') + esc(n.t) + '</span></li>';
    }).join('') + '</ul>';
  }

  function slotCard(g) {
    var cls = 'slot', tag = '';
    if (g.flag === 'empty' || g.flag === 'crit' || g.flag === 'unknown' || !g.name) cls += ' empty';
    if (g.r) cls += ' r-' + g.r;
    if (g.flag === 'dud') tag = '<span class="tag dud">Dud</span>';
    else if (g.flag === 'crit') tag = '<span class="tag crit">Missing</span>';
    else if (g.flag === 'empty') tag = '<span class="tag empty">Empty</span>';
    else if (g.r) tag = '<span>' + RLABEL[g.r] + '</span>';
    var name = g.name || (g.flag === 'crit' ? 'Nothing equipped' : 'Empty slot');
    return '<div class="' + cls + '"><div class="k"><span>' + esc(g.slot) + '</span>' + tag + '</div>' +
      '<div class="name">' + esc(name) + '</div>' + (g.note ? '<div class="note">' + esc(g.note) + '</div>' : '') + '</div>';
  }

  function renderChar(c) {
    var needs = c.needs.slice().sort(function (a, b) { return SEV[a.s] - SEV[b.s]; });
    var abil = c.abil.map(function (v, i) { return '<div><div class="k">' + ABIL[i] + '</div><div class="v num' + (v >= 16 ? ' hi' : '') + '">' + v + '</div></div>'; }).join('');
    return '' +
      '<div style="display:grid;gap:16px">' +
      '<section class="card">' +
        '<div class="charhead">' + mono(c) + '<div><h2>' + esc(c.name) + (c.you ? ' <span class="muted" style="font-size:16px">(you)</span>' : '') + '</h2>' +
        '<div class="sub">' + esc(c.race) + ' · ' + esc(c.cls) + ' ' + c.level + ' · ' + esc(c.sub) + ' · <span class="where ' + c.where + '">' + (c.where === 'party' ? 'In party' : 'At camp') + '</span>' +
        (c.levelUp ? ' <span class="pill crit" style="display:inline-block">Level up</span>' : '') + '</div></div></div>' +
        '<div class="statrow"><div class="stat"><span class="k">Max HP</span><span class="v num">' + c.hp + '</span></div>' +
        '<div class="stat"><span class="k">Armour Class</span><span class="v num">' + c.ac + '</span></div>' + approvalBlock(c.approval) + '</div>' +
        '<div class="abil">' + abil + '</div>' +
        '<div class="camp"><b style="color:var(--fg)">Best at:</b> ' + esc(c.bestAt) + '</div>' +
      '</section>' +
      '<section class="card"><h3>What to fix</h3>' + needsList(needs) + (c.levelPlan ? '<div class="plan"><b>Level plan:</b> ' + esc(c.levelPlan) + '</div>' : '') + '</section>' +
      (c.weapons ? '<section class="card"><h3>Weapon setup</h3><p class="muted" style="margin:0">' + esc(c.weapons.summary) + '</p><div class="opts">' +
        c.weapons.options.map(function (o) { return '<div class="opt ' + o.v + '"><div class="head"><span class="pill ' + o.v + '">' + VLABEL[o.v] + '</span>' + esc(o.name) + '</div><p>' + esc(o.text) + '</p></div>'; }).join('') + '</div></section>' : '') +
      '<section class="card"><h3>Build and proficiencies</h3><div><b>Proficient with:</b> <span class="muted">' + esc(c.prof) + '</span></div><ul class="feat">' +
        c.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></section>' +
      '<section class="card"><h3>Equipment</h3>' +
        '<div class="legend"><span class="r-common">Common</span><span class="r-uncommon">Uncommon</span><span class="r-rare">Rare</span><span class="r-veryrare">Very rare</span><span class="r-story">Story</span></div>' +
        '<div class="gear">' + c.gear.map(slotCard).join('') + '</div>' +
        '<div class="camp">Camp clothes: ' + esc(c.camp) + '</div>' +
      '</section>' +
      '<section class="card"><h3>Upgrade ideas</h3><ul class="ideas">' + c.ideas.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></section>' +
      '</div>';
  }

  function renderParty() {
    var all = [];
    data.party.forEach(function (c) { c.needs.forEach(function (n) { if (n.s !== 'tip') all.push({ s: n.s, t: n.t, who: c.name }); }); });
    all.sort(function (a, b) { return SEV[a.s] - SEV[b.s]; });
    var roster = data.party.map(function (c) {
      var n = warnCount(c), cr = critCount(c);
      return '<button class="mini" type="button" data-go="' + c.id + '"><div class="row">' + mono(c) + '<div><div style="font-weight:700">' + esc(c.name) + '</div>' +
        '<div class="meta">' + esc(c.cls) + ' ' + c.level + ' · ' + esc(c.sub) + '</div></div></div>' +
        '<div class="meta num">HP ' + c.hp + ' · AC ' + c.ac + (c.approval != null ? ' · Approval ' + c.approval : '') + '</div>' +
        '<div class="chips"><span class="where ' + c.where + '">' + (c.where === 'party' ? 'In party' : 'At camp') + '</span>' +
        (c.levelUp ? '<span class="pill crit">Level up</span>' : '') +
        (n ? '<span class="pill ' + (cr ? 'crit' : 'warn') + '">' + n + ' to fix</span>' : '<span class="pill ok">Good</span>') + '</div></button>';
    }).join('');
    return '' +
      '<div style="display:grid;gap:16px">' +
      '<section class="card"><h2>The party</h2><div class="roster">' + roster + '</div></section>' +
      '<section class="card"><h3>Fix list, most urgent first</h3>' + needsList(all, true) + '</section>' +
      '<section class="card"><h3>Shopping list</h3><p class="muted" style="margin:0">You have ' + Number(s.gold).toLocaleString('en-GB') + ' gold. Check every trader you pass.</p><ul class="ideas">' +
        data.shopping.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></section>' +
      '<section class="card"><h3>Quick rules</h3><dl class="gloss">' + data.glossary.map(function (g) { return '<div><dt>' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd></div>'; }).join('') + '</dl></section>' +
      '</div>';
  }

  function route() {
    var id = (location.hash || '#party').slice(1);
    var c = data.party.find(function (p) { return p.id === id; });
    if (!c) id = 'party';
    renderTabs(id);
    var view = document.getElementById('view');
    view.innerHTML = c ? renderChar(c) : renderParty();
    view.classList.remove('view'); void view.offsetWidth; view.classList.add('view');
    var t = document.querySelector('.tab[aria-current="page"]');
    if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  document.getElementById('view').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) { location.hash = b.getAttribute('data-go'); window.scrollTo(0, 0); }
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
